[workspace]
resolver = "2"
members = ["crates/gbdt-core", "contracts/bursa", "contracts/consumer-example", "evaluator"]
exclude = ["spikes"]

[workspace.dependencies]
near-sdk = "5.30"
borsh = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
