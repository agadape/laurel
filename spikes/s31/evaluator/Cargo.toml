[package]
name = "evaluator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "evaluator"
path = "src/main.rs"

[features]
default = ["host"]
# `host`: fetch model bytes through OutLayer's `near:rpc/api` view host function.
# Without it (local wasmtime run) the model comes from stdin as hex.
host = ["dep:wit-bindgen"]

[dependencies]
gbdt-core = { path = "../gbdt-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
wit-bindgen = { version = "0.36", optional = true }
