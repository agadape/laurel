[package]
name = "gbdt-core"
version = "0.1.0"
edition = "2021"
description = "Integer-only GBDT evaluator shared by the NEAR contract and the OutLayer evaluator (S31 spike)."

[dependencies]
borsh = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
